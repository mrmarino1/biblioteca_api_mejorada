{% extends "base.html" %}

{% block title %}Biblioteca - Registrar libro{% endblock %}
{% block ubicacion %}Registrar libro{% endblock %}

{% block content %}
<div class="card border-0 shadow-sm">
    <div class="card-body">
        <h1 class="h5 fw-bold mb-3">Registrar nuevo libro</h1>

        <form id="formRegistrarLibro" onsubmit="event.preventDefault(); registrarLibro();">
            <div class="mb-3">
                <label for="tituloLibro" class="form-label">Título</label>
                <input type="text" id="tituloLibro" class="form-control" placeholder="Ej. Cien años de soledad"
                    required>
            </div>

            <div class="mb-3">
                <label for="autorLibro" class="form-label">Autor</label>
                <input type="text" id="autorLibro" class="form-control" placeholder="Ej. Gabriel García Márquez"
                    required>
            </div>

            <div class="mb-3">
                <label for="stockLibro" class="form-label">Stock</label>
                <input type="number" id="stockLibro" class="form-control" min="0" value="1" required>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-plus-circle me-1"></i>Guardar libro
                </button>
                <button type="button" class="btn btn-outline-secondary" onclick="limpiarFormularioLibro()">
                    Limpiar
                </button>
            </div>
        </form>

        <p id="mensajeRegistroLibro" class="text-secondary small mt-3 mb-0"></p>
    </div>
</div>
{% endblock %}
