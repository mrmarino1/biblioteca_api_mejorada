{% extends "base.html" %}

{% block title %}Biblioteca - Buscar préstamo{% endblock %}
{% block ubicacion %}Buscar préstamo{% endblock %}

{% block content %}
<div class="card border-0 shadow-sm">
    <div class="card-body">
        <h1 class="h5 fw-bold mb-3">Buscar préstamo por ID</h1>

        <form class="row g-2 align-items-end mb-4" onsubmit="event.preventDefault(); buscarPrestamoPorId();">
            <div class="col-sm-5 col-md-4">
                <label for="idPrestamoBuscar" class="form-label">ID del préstamo</label>
                <input type="number" id="idPrestamoBuscar" class="form-control" min="1" placeholder="Ej. 1" required>
            </div>
            <div class="col-auto">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-search me-1"></i>Buscar
                </button>
                <button type="button" class="btn btn-outline-secondary" onclick="limpiarBusquedaPrestamo()">
                    Limpiar
                </button>
            </div>
        </form>

        <p id="mensajeBusquedaPrestamo" class="text-secondary small"></p>

        <div id="resultadoPrestamo" class="d-none">
            <div class="table-responsive">
                <table class="table table-bordered table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>Libro</th>
                            <th>Estudiante</th>
                            <th>Fecha préstamo</th>
                            <th>Estado</th>
                            <th>Fecha devolución</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="cuerpoPrestamoBuscado"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>
{% endblock %}
