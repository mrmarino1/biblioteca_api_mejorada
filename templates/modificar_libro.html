{% extends "base.html" %}

{% block title %}Biblioteca - Modificar libro{% endblock %}
{% block ubicacion %}Modificar libro{% endblock %}

{% block content %}
<div class="card border-0 shadow-sm">
    <div class="card-body">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1 class="h5 fw-bold mb-0">Modificar libro #{{ libro_id }}</h1>
            <a href="/libros" class="btn btn-sm btn-outline-secondary">Volver a libros</a>
        </div>

        <form id="formModificarLibro" onsubmit="event.preventDefault(); guardarCambiosLibro();">
            <input type="hidden" id="idLibroEditar" value="{{ libro_id }}">

            <div class="mb-3">
                <label for="tituloLibroEditar" class="form-label">Título</label>
                <input type="text" id="tituloLibroEditar" class="form-control" required>
            </div>

            <div class="mb-3">
                <label for="autorLibroEditar" class="form-label">Autor</label>
                <input type="text" id="autorLibroEditar" class="form-control" required>
            </div>

            <div class="mb-3">
                <label for="stockLibroEditar" class="form-label">Stock</label>
                <input type="number" id="stockLibroEditar" class="form-control" min="0" required>
            </div>

            <button type="submit" class="btn btn-warning text-dark fw-semibold">
                <i class="bi bi-pencil-square me-1"></i>Guardar cambios
            </button>
        </form>

        <p id="mensajeEditarLibro" class="text-secondary small mt-3 mb-0"></p>
    </div>
</div>
{% endblock %}
