{% extends "base.html" %}

{% block title %}Biblioteca - Registrar préstamo{% endblock %}
{% block ubicacion %}Registrar préstamo{% endblock %}

{% block content %}
<div class="card border-0 shadow-sm">
    <div class="card-body">
        <h1 class="h5 fw-bold mb-3">Registrar nuevo préstamo</h1>

        <form id="formRegistrarPrestamo" onsubmit="event.preventDefault(); registrarPrestamo();">
            <div class="mb-3">
                <label for="libroPrestamo" class="form-label">Libro</label>
                <select id="libroPrestamo" class="form-select" required>
                    <option value="">Cargando libros...</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="estudiantePrestamo" class="form-label">Estudiante</label>
                <input type="text" id="estudiantePrestamo" class="form-control" placeholder="Ej. Ana Quispe" required>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-journal-plus me-1"></i>Registrar préstamo
                </button>
                <button type="button" class="btn btn-outline-secondary" onclick="limpiarFormularioPrestamo()">
                    Limpiar
                </button>
            </div>
        </form>

        <p id="mensajeRegistroPrestamo" class="text-secondary small mt-3 mb-0"></p>
    </div>
</div>
{% endblock %}
