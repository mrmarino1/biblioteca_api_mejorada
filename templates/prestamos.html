{% extends "base.html" %}

{% block title %}Biblioteca - Préstamos{% endblock %}
{% block ubicacion %}Ver todos los préstamos{% endblock %}

{% block content %}
<div class="card border-0 shadow-sm">
    <div class="card-body">
        <h1 class="h5 fw-bold mb-3">Listado de préstamos</h1>

        <div class="mb-3 d-flex gap-2 flex-wrap">
            <button type="button" class="btn btn-primary btn-sm" onclick="mostrarPrestamos()">Mostrar préstamos</button>
            <button type="button" class="btn btn-outline-secondary btn-sm" onclick="limpiarPrestamos()">Limpiar
                tabla</button>
        </div>

        <p id="mensajePrestamos" class="text-secondary small"></p>

        <div class="table-responsive">
            <table class="table table-bordered table-hover align-middle">
                <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Libro</th>
                        <th>Estudiante</th>
                        <th>Fecha préstamo</th>
                        <th>Estado</th>
                        <th>Fecha devolución</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="cuerpoPrestamos"></tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
