<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Biblioteca{% endblock %}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Tu CSS personalizado -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark custom-navbar sticky-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" href="{{ url_for('inicio') }}">
                <span class="brand-badge"><i class="bi bi-book-half"></i></span>
                <span>Biblioteca</span>
            </a>

            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse"
                data-bs-target="#menuPrincipal">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menuPrincipal">
                <ul class="navbar-nav ms-auto gap-1">
                    <li class="nav-item">
                        <a class="nav-link {{ 'active' if request.endpoint == 'ver_libros' }}"
                            href="{{ url_for('ver_libros') }}">
                            <i class="bi bi-journals me-1"></i>Ver todos los libros
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {{ 'active' if request.endpoint == 'buscar_libro' }}"
                            href="{{ url_for('buscar_libro') }}">
                            <i class="bi bi-search me-1"></i>Buscar libro por ID
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {{ 'active' if request.endpoint == 'registrar_libro' }}"
                            href="{{ url_for('registrar_libro') }}">
                            <i class="bi bi-plus-circle me-1"></i>Registrar libro
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {{ 'active' if request.endpoint == 'ver_prestamos' }}"
                            href="{{ url_for('ver_prestamos') }}">
                            <i class="bi bi-arrow-left-right me-1"></i>Ver todos los préstamos
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {{ 'active' if request.endpoint == 'buscar_prestamo' }}"
                            href="{{ url_for('buscar_prestamo') }}">
                            <i class="bi bi-file-earmark-text me-1"></i>Buscar préstamo
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {{ 'active' if request.endpoint == 'registrar_prestamo' }}"
                            href="{{ url_for('registrar_prestamo') }}">
                            <i class="bi bi-bookmark-plus me-1"></i>Registrar préstamo
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Franja de ubicación actual -->
    <div class="location-bar">
        <div class="container d-flex justify-content-between align-items-center flex-wrap gap-2">
            <div class="d-flex align-items-center gap-2 text-secondary small">
                <i class="bi bi-geo-alt-fill text-primary"></i>
                <span>Estás en:</span>
                <strong class="text-dark">{% block ubicacion %}Inicio{% endblock %}</strong>
            </div>
        </div>
    </div>

    <main class="container py-4">
        {% block content %}{% endblock %}
    </main>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Tu JS personalizado -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>

</html>
