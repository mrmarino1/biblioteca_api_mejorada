{% extends "base.html" %}

{% block title %}Biblioteca - Buscar libro por ID{% endblock %}
{% block ubicacion %}Buscar libro por ID{% endblock %}

{% block content %}
<div class="card border-0 shadow-sm">
    <div class="card-body">
        <h1 class="h5 fw-bold mb-3">Buscar libro por ID</h1>

        <form class="row g-2 align-items-end mb-4" onsubmit="event.preventDefault(); buscarLibroPorId();">
            <div class="col-sm-5 col-md-4">
                <label for="idLibroBuscar" class="form-label">ID del libro</label>
                <input type="number" id="idLibroBuscar" class="form-control" min="1" placeholder="Ej. 1" required>
            </div>
            <div class="col-auto">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-search me-1"></i>Buscar
                </button>
                <button type="button" class="btn btn-outline-secondary" onclick="limpiarBusquedaLibro()">
                    Limpiar
                </button>
            </div>
        </form>

        <p id="mensajeBusquedaLibro" class="text-secondary small"></p>

        <div id="resultadoLibro" class="d-none">
            <div class="table-responsive">
                <table class="table table-bordered table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th class="text-center">Portada</th>
                            <th>Título</th>
                            <th>Autor</th>
                            <th>Stock</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="cuerpoLibroBuscado"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>
{% endblock %}
